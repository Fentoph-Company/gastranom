services:
  - type: web
    name: gastranom
    env: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        value: 8857592268:AAGiB4PXMWli-Ag6s-LfBhK_hHeC4YQHWQE
      - key: TELEGRAM_CHAT_ID
        sync: false
